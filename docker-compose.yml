x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: local-rag-chat:0.1.0
    build:
      context: .
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      ENVIRONMENT: "production"
      AUTH_REQUIRED: "true"
      HOST: "0.0.0.0"
      PORT: "8000"
      DATA_DIR: "/app/data"
      LOG_DIR: "/app/data/logs"
      UPLOAD_DIR: "/app/data/uploads"
      CHROMA_DIR: "/app/data/chroma"
      METADATA_DIR: "/app/data/metadata"
      CHAT_HISTORY_DIR: "/app/data/chat_history"
      BACKUP_DIR: "/app/data/backups"
      EVALUATION_DIR: "/app/data/evaluations"
      DATABASE_URL: "sqlite:////app/data/metadata/local_rag_chat.db"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      CHAT_MODEL: "${CHAT_MODEL:-}"
      CHAT_TEMPERATURE: "${CHAT_TEMPERATURE:-0.1}"
      CHAT_MAX_TOKENS: "${CHAT_MAX_TOKENS:-1024}"
      CHAT_TIMEOUT_SECONDS: "${CHAT_TIMEOUT_SECONDS:-60}"
      CHAT_MAX_ATTEMPTS: "${CHAT_MAX_ATTEMPTS:-2}"
      RAG_CONTEXT_MAX_CHARS: "${RAG_CONTEXT_MAX_CHARS:-12000}"
      WEB_SEARCH_ENABLED: "${WEB_SEARCH_ENABLED:-false}"
      DEFAULT_RETRIEVAL_MODE: "${DEFAULT_RETRIEVAL_MODE:-knowledge_first}"
      RETRIEVAL_MIN_EVIDENCE_COUNT: "${RETRIEVAL_MIN_EVIDENCE_COUNT:-1}"
      RETRIEVAL_FRESHNESS_TERMS: '${RETRIEVAL_FRESHNESS_TERMS:-["今天","当前","最新","today","latest"]}'
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-disabled}"
      WEB_SEARCH_API_KEY: "${WEB_SEARCH_API_KEY:-}"
      WEB_SEARCH_ALLOWED_ROLES: '${WEB_SEARCH_ALLOWED_ROLES:-["ADMIN","USER"]}'
      WEB_SEARCH_ALLOWED_DOMAINS: "${WEB_SEARCH_ALLOWED_DOMAINS:-[]}"
      WEB_SEARCH_BLOCKED_DOMAINS: "${WEB_SEARCH_BLOCKED_DOMAINS:-[]}"
      WEB_SEARCH_RESULT_LIMIT: "${WEB_SEARCH_RESULT_LIMIT:-5}"
      WEB_FETCH_MAX_PAGES: "${WEB_FETCH_MAX_PAGES:-5}"
      WEB_FETCH_MAX_PAGES_PER_DOMAIN: "${WEB_FETCH_MAX_PAGES_PER_DOMAIN:-2}"
      WEB_SEARCH_QUERY_MAX_CHARS: "${WEB_SEARCH_QUERY_MAX_CHARS:-512}"
      WEB_PAGE_MAX_CHARS: "${WEB_PAGE_MAX_CHARS:-6000}"
      WEB_FETCH_MAX_RESPONSE_BYTES: "${WEB_FETCH_MAX_RESPONSE_BYTES:-2097152}"
      WEB_SEARCH_TIMEOUT_SECONDS: "${WEB_SEARCH_TIMEOUT_SECONDS:-5}"
      WEB_FETCH_TIMEOUT_SECONDS: "${WEB_FETCH_TIMEOUT_SECONDS:-5}"
      WEB_TOTAL_TIMEOUT_SECONDS: "${WEB_TOTAL_TIMEOUT_SECONDS:-12}"
      WEB_FETCH_MAX_REDIRECTS: "${WEB_FETCH_MAX_REDIRECTS:-3}"
      WEB_SEARCH_CACHE_TTL_SECONDS: "${WEB_SEARCH_CACHE_TTL_SECONDS:-300}"
      WEB_QUERY_LOG_MODE: "digest"
      WEB_CONTENT_CACHE_ENABLED: "false"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-false}"
      METRICS_SCRAPE_TOKEN: "${METRICS_SCRAPE_TOKEN:?METRICS_SCRAPE_TOKEN is required}"
      BACKUP_SIGNING_KEY: "${BACKUP_SIGNING_KEY:?BACKUP_SIGNING_KEY is required}"
      BOOTSTRAP_SECRET: "${BOOTSTRAP_SECRET:?BOOTSTRAP_SECRET is required}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - local-rag-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: local-rag-chat:0.1.0
    command: ["python", "scripts/run_migrations.py"]
    environment:
      DATA_DIR: "/app/data"
      DATABASE_URL: "sqlite:////app/data/metadata/local_rag_chat.db"
    volumes:
      - local-rag-data:/app/data
    restart: "no"
    logging: *default-logging

  frontend:
    image: local-rag-chat-frontend:0.1.0
    build:
      context: ./frontend
      args:
        VITE_API_MODE: "real"
        VITE_API_BASE_URL: "/"
        VITE_API_TIMEOUT_MS: "${VITE_API_TIMEOUT_MS:-15000}"
    ports:
      - "${FRONTEND_PORT:-8501}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  legacy-ui:
    profiles: ["legacy"]
    image: local-rag-chat:0.1.0
    command:
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_BASE_URL: "http://backend:8000"
      API_TIMEOUT_SECONDS: "5"
    ports:
      - "${LEGACY_UI_PORT:-8502}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  local-rag-data:
